name: Setup
description: Python deps, and fonts + ffmpeg when rendering video
inputs:
  render:
    description: Install fonts and ffmpeg for rendering
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - shell: bash
      run: pip install -q -r requirements.txt
    - if: inputs.render == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
