name: Setup
description: Python deps, and fonts + ffmpeg when rendering video
inputs:
  render:
    description: Install fonts and ffmpeg for rendering
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - shell: bash
      run: pip install -q -r requirements.txt
    - if: inputs.render == 'true'
      shell: bash
      # apt mirrors sometimes hang a runner until the job times out; cap each try and retry
      run: |
        for i in 1 2 3; do
          if timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq &&
             timeout 360 sudo apt-get -o Acquire::Retries=3 install -y -qq fonts-noto-cjk ffmpeg libcairo2 >/dev/null; then
            break
          fi
          [ "$i" = 3 ] && exit 1
          echo "apt-get attempt $i failed or timed out; retrying"
          sleep 10
        done
