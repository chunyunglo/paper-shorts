# Daily: read every post's numbers (YouTube, Instagram, Threads) into the state branch:
# analytics/latest.json, history.jsonl, report.md, and a weekly strategy.md written by Claude
# (every past note is kept in strategy_log.md), preceded by a self-review of past decisions against
# their results (lessons.md, history in lessons_log.md). Each new weekly note is emailed to the owner
# (ALERT_EMAIL_* secrets) with the self-review and the numbers.
# that the podcast picks and writes from. Read-only on every platform. Logs show counts only.
name: Channel analytics

on:
  schedule:
    - cron: "30 1 * * *"   # 09:30 Taiwan
  workflow_dispatch:
    inputs:
      strategy:
        description: Rewrite the self-review and strategy note now
        type: boolean
        default: false
      email:
        description: Email the weekly report now (it is also sent whenever the strategy is rewritten)
        type: boolean
        default: false

concurrency: state-analytics

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load state
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - uses: ./.github/actions/setup
      - name: Read the numbers
        env:
          STATE_DIR: state
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m shorts analytics ${{ inputs.strategy && '--strategy' || '' }} ${{ inputs.email && '--email' || '' }}
      - name: Save to the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          if [ ! -d .git ]; then
            git init -q -b state
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics
          git diff --cached --quiet && exit 0
          git commit -qm "Update channel analytics"
          for i in 1 2 3; do git pull -q --rebase origin state 2>/dev/null; git push -q origin HEAD:state && break; sleep 5; done
          echo "Report: ${{ github.server_url }}/${{ github.repository }}/blob/state/analytics/report.md"
