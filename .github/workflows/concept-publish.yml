# 無聊統計學: put one finished episode (a concept-demo-N pre-release with episode.mp3) on the public feed.
# It becomes release boring-epNN, and docs/boring-stats/feed.xml on main (GitHub Pages) is rebuilt, so
# Spotify, Apple Podcasts and KKBOX pick it up once the feed has been submitted to them.
# Refuses to run until cast.json "feed" has the owner email and cover art the directories require.
# Manual only: nothing is published unless someone runs this.
name: Publish podcast episode

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The pre-release holding the finished episode, e.g. concept-demo-7"
        required: true

concurrency: concept-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event.inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          pip install -q anthropic==2.3.0 pydantic==2.13.5
          python -c "from concept_show import feed; m = feed.missing(); m and exit('Fill cast.json feed: ' + ', '.join(m))"
      - name: New release boring-epNN
        run: |
          mkdir ep && gh release download "$RELEASE" -D ep -p episode.mp3 -p meta.json
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '[.[] | select(.tag_name | startswith("boring-ep"))] | length')
          tag=$(printf 'boring-ep%02d' $((n + 1)))
          gh release create "$tag" ep/episode.mp3 ep/meta.json --target main \
            --title "$(jq -r .title ep/meta.json)" --notes "$(jq -r .description ep/meta.json)"
          echo "Published $tag from $RELEASE"
      - name: Rebuild the feed on main
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python -m concept_show feed releases.json docs/boring-stats/feed.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/boring-stats/feed.xml
          git commit -m "Podcast feed: publish from $RELEASE [skip ci]"
          git push origin HEAD:main
