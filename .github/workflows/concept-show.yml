# Chinese concept podcast 無聊統計學: demo episodes, never published.
# Two separate jobs that run back to back, with the script saved in between:
#   script  There is no fixed season. Claude first reads concept_show/strategy.json, concept_show/feedback.md
#           and every earlier episode (meta.json and strategy notes on the concept-demo-* pre-releases),
#           decides the next topic and updates the strategy notes. Then it writes the two-friend Traditional
#           Chinese talk, a second Claude pass checks concepts and forbids invented facts, and the script, the
#           plan and the notes are saved on a pre-release concept-demo-N.
#   voice   Fetches that saved script, voices it with Gemini Flash TTS (2-3 requests an episode), and adds the MP3 to the same pre-release.
#           No Claude calls. If it fails, re-run only this job (or run the workflow with release=concept-demo-N):
#           the script is not written again.
#   publish Scheduled runs only: puts the finished episode on the public feed (concept-publish.yml).
# Runs by itself twice a week. Can also be run by hand, or by pushing to a claude/* branch with [concept-show]
# in the commit message; those runs stop at the pre-release unless publish=true is chosen.
name: Concept podcast demo

on:
  schedule:
    - cron: "30 8 * * 1,4"   # Mondays and Thursdays 16:30 Taiwan, just after the Gemini daily quota resets
  workflow_dispatch:
    inputs:
      request:
        description: "Optional instruction for this episode's topic (blank = let the planner decide)"
        default: ""
      release:
        description: "Only voice the script already saved on this pre-release (e.g. concept-demo-2); skips writing"
        default: ""
      sample_lines:
        description: "Voice only the first N lines, to try a voice change cheaply (blank = whole episode)"
        default: ""
      out_name:
        description: "File name for the MP3 on the pre-release (blank = episode.mp3)"
        default: ""
      publish:
        description: "Also put the finished episode on the public feed"
        type: boolean
        default: false
      max_requests:
        description: "Most Gemini TTS requests this run may send (the key allows 100 a day)"
        default: "25"
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  script:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == '')
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[concept-show]'))
    concurrency: concept-show-script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.save.outputs.release }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REQUEST: ${{ github.event.inputs.request }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY is not set"; exit 1; }
          pip install -q anthropic==2.3.0 pydantic==2.13.5
      - name: Earlier episodes (records and strategy notes from the concept-demo pre-releases)
        run: |
          mkdir -p history
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName | select(startswith("concept-demo-"))'); do
            gh release download "$tag" -D "history/$tag" -p meta.json -p strategy.md 2>/dev/null || true
          done
          # Download counts of the published episodes (boring-ep* releases), for the planner
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python -c "import json; from concept_show import feed; json.dump(feed.published(json.load(open('releases.json'))), open('history/stats.json', 'w'), ensure_ascii=False)"
          ls history | wc -l
      - name: Plan and write the script
        shell: bash
        run: |
          python -m concept_show make --history history ${REQUEST:+--request "$REQUEST"} | tee make.log
          grep -m1 '^EP_DIR=' make.log >> "$GITHUB_ENV"
      - name: Save it on a pre-release
        id: save
        run: |
          tag="concept-demo-${{ github.run_number }}"
          gh release create "$tag" "$EP_DIR/script.md" "$EP_DIR/meta.json" "$EP_DIR/show.json" \
            "$EP_DIR/plan.md" "$EP_DIR/strategy.md" \
            --prerelease --target "${{ github.sha }}" --title "Concept podcast demo #${{ github.run_number }} (not posted)" \
            --notes "$(jq -r '.title + "：" + .one_liner' "$EP_DIR/meta.json")"
          echo "release=$tag" >> "$GITHUB_OUTPUT"

  voice:
    needs: script
    if: >-
      always() && (needs.script.result == 'success'
      || (needs.script.result == 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.release != ''))
    concurrency: concept-show-voice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RELEASE: ${{ needs.script.outputs.release || github.event.inputs.release }}
      TTS_SAMPLE_LINES: ${{ github.event.inputs.sample_lines }}
      TTS_MAX_REQUESTS: ${{ github.event.inputs.max_requests || '25' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "GEMINI_API_KEY is not set"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q anthropic==2.3.0 pydantic==2.13.5
      - name: Fetch the saved script
        run: |
          d="$PWD/out/concept_show/$RELEASE"; mkdir -p "$d"
          gh release download "$RELEASE" -D "$d" -p show.json
          echo "EP_DIR=$d" >> "$GITHUB_ENV"
      # Voiced chunks are cached by text, so a rerun after a failure only sends what is still missing
      - uses: actions/cache/restore@v4
        with:
          path: out/concept_show/.tts
          key: concept-tts-${{ github.run_id }}
          restore-keys: concept-tts-
      - name: Voices (Gemini Flash TTS, whole episode in 2-3 requests, paced under 10 a minute)
        run: python -m concept_show voice "$EP_DIR/show.json" "$EP_DIR/episode.wav"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: out/concept_show/.tts
          key: concept-tts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: MP3 onto the same pre-release
        run: |
          ffmpeg -v error -y -i "$EP_DIR/episode.wav" -af loudnorm=I=-16:TP=-1.5:LRA=11 \
            -ac 1 -ar 44100 -b:a 96k "$EP_DIR/episode.mp3"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$EP_DIR/episode.mp3"
          name="${{ github.event.inputs.out_name || 'episode.mp3' }}"
          [ -n "$TTS_SAMPLE_LINES" ] && name="sample-${{ github.run_number }}.mp3"
          [ "$name" = episode.mp3 ] || mv "$EP_DIR/episode.mp3" "$EP_DIR/$name"
          gh release upload "$RELEASE" "$EP_DIR/$name" --clobber
          for f in out/concept_show/previews/*.wav; do [ -f "$f" ] && gh release upload "$RELEASE" "$f" --clobber; done; true

  publish:
    needs: [script, voice]
    if: >-
      always() && needs.voice.result == 'success' && github.event.inputs.sample_lines == ''
      && (github.event.inputs.out_name == '' || github.event.inputs.out_name == 'episode.mp3')
      && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    uses: ./.github/workflows/concept-publish.yml
    with:
      release: ${{ needs.script.outputs.release || github.event.inputs.release }}
