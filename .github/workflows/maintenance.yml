# Weekly: renew Instagram/Threads tokens (they expire after 60 days) and keep the
# scheduled workflows enabled (GitHub disables them after 60 days of no activity).
name: Maintenance

on:
  schedule:
    - cron: "40 2 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Keep schedules enabled
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m shorts keepalive
      - name: Refresh Instagram and Threads tokens
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python -m shorts refresh-tokens
