# Monday to Saturday (Sunday off):
#   14:00 Taiwan   prepare: pick a paper, make the Chinese, English and Brazilian Portuguese
#                  videos, put them on a pre-release, and open a review issue (GitHub
#                  emails/pushes the owner).
#   19:00 Taiwan   publish zh + en, if the owner replied "OK" / "沒問題" on the review issue.
#   19:00 Brasília publish pt (22:00 UTC, 06:00 Taiwan the next day), then close the issue.
# Unapproved reviews are closed as skipped. Scheduled runs need the variable AUTO_PUBLISH=true.
name: Publish episode

on:
  schedule:
    - cron: "0 6 * * 1-6"   # 14:00 Taiwan: prepare
    - cron: "0 11 * * 1-6"  # 19:00 Taiwan: publish zh + en
    - cron: "0 22 * * 1-6"  # 19:00 Brasília: publish pt
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = make videos + review issue; publish = post approved episodes now; delete = remove an episode's posts"
        type: choice
        options: [prepare, publish, delete]
        default: prepare
      langs:
        description: "publish: which videos (space-separated: zh en pt)"
        default: "zh en pt"
      episode:
        description: "prepare: remake this published episode instead of picking a new paper; delete: the episode to remove"
        default: ""

concurrency: publish

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1-6' && vars.AUTO_PUBLISH == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      TTS_VOICE_ZH: ${{ vars.TTS_VOICE_ZH }}
      TTS_VOICE_EN: ${{ vars.TTS_VOICE_EN }}
      TTS_VOICE_PT: ${{ vars.TTS_VOICE_PT }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip paused dates
        if: github.event_name == 'schedule'
        run: |
          if grep -qx "$(TZ=Asia/Taipei date +%F)" data/skip_dates.txt; then
            echo "Today is in data/skip_dates.txt; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/setup
        if: env.SKIP != '1'
        with:
          render: "true"
      - name: Make episode
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAKE: ${{ inputs.episode }}
        run: |
          if [ -n "$REMAKE" ]; then
            mkdir -p old
            gh release download "ep-$REMAKE" --dir old --pattern episode.json
            python -m shorts make --episode-json old/episode.json
          else
            python -m shorts make
          fi
          echo "EP_DIR=$(ls -d out/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Put videos on a pre-release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ep-$(basename "$EP_DIR")"
          title=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['script']['title_zh'])" "$EP_DIR/episode.json")
          gh release create "$tag" "$EP_DIR"/video_*.mp4 "$EP_DIR"/cover_*.jpg "$EP_DIR/episode.json" "$EP_DIR/script.md" \
            --prerelease --title "$title" --notes-file "$EP_DIR/script.md"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Open review issue
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_AT: ${{ github.event_name == 'schedule' && '中文、英文今晚 19:00；葡語巴西時間 19:00（台灣隔天早上 6:00）' || '確認後馬上上片（手動測試）' }}
        run: python -m shorts review-open "$EP_DIR" "$TAG"

  publish:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 6 * * 1-6' && vars.AUTO_PUBLISH == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # 11:00 UTC runs post zh + en; 22:00 UTC runs post pt and close the review.
      LANGS: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 11 * * 1-6' && 'zh en' || 'pt') || inputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Publish approved episodes
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          status=0
          python -m shorts review-approved | grep -E '^[0-9]+ ep-' > approved.txt || true
          while read -r number tag; do
            dir="out/${tag#ep-}"
            mkdir -p "$dir"
            gh release download "$tag" --dir "$dir" --pattern 'video_*.mp4' --pattern 'episode.json'
            base="https://github.com/${{ github.repository }}/releases/download/$tag"
            # shellcheck disable=SC2086
            if python -m shorts publish "$dir" --video-base-url "$base" --langs $LANGS; then
              # the review stays open until every video in the episode is out
              if python -c "import json,sys;e=json.load(open(sys.argv[1]));sys.exit(0 if all(e.get('posts',{}).get(l) for l in e['videos']) else 1)" "$dir/episode.json"; then
                gh release edit "$tag" --prerelease=false --latest
                links=$(python -c "import json,sys;e=json.load(open(sys.argv[1]));print('\n'.join(f'- {l} {p}: {v[\"url\"]}' for l,ps in e['posts'].items() for p,v in ps.items()))" "$dir/episode.json")
                python -m shorts review-close "$number" --published --message "$(printf '已上片 Published:\n%s' "$links")"
              fi
            else
              status=1
              python -m shorts review-close "$number" --message "上片時有平台失敗，請看 Actions 紀錄。Some platforms failed; see the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            fi
          done < approved.txt
          python -m shorts review-skip-unapproved
          exit $status
      - name: Record history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -qm "Record published episodes"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

  delete:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delete' && inputs.episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the episode's posts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          EPISODE: ${{ inputs.episode }}
        run: python -m shorts delete-posts "$EPISODE"
      - name: Record history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -qm "Remove deleted episode posts"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
