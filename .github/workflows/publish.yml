# Monday to Saturday (Sunday off):
#   14:00 Taiwan   prepare: pick a paper, make the Chinese and English videos, put them on
#                  a pre-release, and open a review issue (GitHub emails/pushes the owner).
#   19:00 Taiwan   publish zh + en, then close the issue.
# Unapproved reviews are closed as skipped. Scheduled runs need the variable AUTO_PUBLISH=true.
name: Publish episode

on:
  # GitHub drops scheduled events under load (on this repo it has never fired publish at all),
  # so a Claude scheduled task also dispatches each slot with auto=true. Repeats are
  # harmless: prepare skips once today's review issue exists, and publish only posts what is
  # approved and not yet out.
  schedule:
    - cron: "0 6 * * 1-6"   # 14:00 Taiwan: prepare
    - cron: "40 6 * * 1-6"  #   backup
    - cron: "20 7 * * 1-6"  #   backup
    - cron: "0 11 * * 1-6"  # 19:00 Taiwan: publish zh + en
    - cron: "25 11 * * 1-6" #   backup
    - cron: "50 11 * * 1-6" #   backup
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = make videos + review issue; publish = post approved episodes now; delete = remove an episode's posts"
        type: choice
        options: [prepare, publish, delete]
        default: prepare
      langs:
        description: "publish: which videos (space-separated: zh en)"
        default: "zh en"
      episode:
        description: "prepare: remake this published episode instead of picking a new paper; delete: the episode to remove"
        default: ""
      auto:
        description: "Sent by the backup scheduler: behave like a scheduled run (needs AUTO_PUBLISH, skips paused or already-prepared days)"
        type: boolean
        default: false

env:
  # empty or anything but "true": no owner review, episodes post unless the owner replies "不要上"
  REVIEW_REQUIRED: ${{ vars.REVIEW_REQUIRED }}

concurrency: publish

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: >-
      (github.event_name == 'schedule' && contains(fromJSON('["0 6 * * 1-6","40 6 * * 1-6","20 7 * * 1-6"]'), github.event.schedule) && vars.AUTO_PUBLISH == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare' && (!inputs.auto || vars.AUTO_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      TTS_VOICE_ZH: ${{ vars.TTS_VOICE_ZH }}
      TTS_VOICE_EN: ${{ vars.TTS_VOICE_EN }}
      TTS_VOICE_PT: ${{ vars.TTS_VOICE_PT }}
      UNPAYWALL_EMAIL: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip paused dates and days already prepared
        if: github.event_name == 'schedule' || inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Taipei date +%F)
          if grep -qx "$today" data/skip_dates.txt; then
            echo "Today is in data/skip_dates.txt; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          # a backup slot, or a manual prepare earlier today, already opened today's review
          since=$(date -u -d "$today 00:00 +0800" +%FT%TZ)
          if [ -n "$(gh issue list -R "$GITHUB_REPOSITORY" --label review --state all --search "created:>=$since" --json number --jq '.[].number')" ]; then
            echo "Today's review issue already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Load channel notes (analytics, viewer feedback)
        if: env.SKIP != '1'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - uses: ./.github/actions/setup
        if: env.SKIP != '1'
        with:
          render: "true"
      - name: Make episode
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAKE: ${{ inputs.episode }}
        run: |
          if [ -n "$REMAKE" ]; then
            mkdir -p old
            gh release download "ep-$REMAKE" --dir old --pattern episode.json
            python -m shorts make --episode-json old/episode.json
          else
            python -m shorts make
          fi
          echo "EP_DIR=$(ls -d out/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Put videos on a pre-release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ep-$(basename "$EP_DIR")"
          title=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['script']['title_zh'])" "$EP_DIR/episode.json")
          gh release create "$tag" "$EP_DIR"/video_*.mp4 "$EP_DIR"/cover_*.jpg "$EP_DIR/episode.json" "$EP_DIR/script.md" \
            --prerelease --title "$title" --notes-file "$EP_DIR/script.md"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Open review issue
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_AT: '中文、英文今晚 19:00；葡語巴西時間 19:00（台灣隔天早上 6:00）'
        run: python -m shorts review-open "$EP_DIR" "$TAG"
      - name: Tell the owner today's episode stopped
        if: failure() && (github.event_name == 'schedule' || inputs.auto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "今天的短片沒有上 / Today's short stopped" \
            --body "自動流程在這裡停下，今天不會上片（AI 查核或看畫面沒過也會停在這裡）。The run stopped; nothing will be posted today: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publish:
    if: >-
      (github.event_name == 'schedule' && !contains(fromJSON('["0 6 * * 1-6","40 6 * * 1-6","20 7 * * 1-6"]'), github.event.schedule) && vars.AUTO_PUBLISH == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && (!inputs.auto || vars.AUTO_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # scheduled runs post zh + en (Portuguese was dropped; older episodes' pt videos are not posted)
      LANGS: ${{ github.event_name == 'schedule' && 'zh en' || inputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Publish approved episodes
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          status=0
          python -m shorts review-approved | grep -E '^[0-9]+ ep-' > approved.txt || true
          while read -r number tag; do
            dir="out/${tag#ep-}"
            mkdir -p "$dir"
            gh release download "$tag" --dir "$dir" --pattern 'video_*.mp4' --pattern 'episode.json'
            base="https://github.com/${{ github.repository }}/releases/download/$tag"
            # shellcheck disable=SC2086
            if python -m shorts publish "$dir" --video-base-url "$base" --langs $LANGS; then
              # the review stays open until every video in the episode is out
              if python -c "import json,sys;e=json.load(open(sys.argv[1]));sys.exit(0 if all(e.get('posts',{}).get(l) for l in e['videos'] if l != 'pt') else 1)" "$dir/episode.json"; then
                gh release edit "$tag" --prerelease=false --latest
                links=$(python -c "import json,sys;e=json.load(open(sys.argv[1]));print('\n'.join(f'- {l} {p}: {v[\"url\"]}' for l,ps in e['posts'].items() for p,v in ps.items()))" "$dir/episode.json")
                python -m shorts review-close "$number" --published --message "$(printf '已上片 Published:\n%s' "$links")"
              fi
            else
              status=1
              # keep the review open: the episode is still approved, and a later run or a manual
              # re-run can finish it; posts already made are not repeated
              python -m shorts review-close "$number" --keep-open --message "上片時有平台失敗，請看 Actions 紀錄；修好後重跑 publish 會補上沒上成功的。Some platforms failed; see the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            fi
          done < approved.txt
          python -m shorts review-skip-unapproved
          exit $status
      - name: Record history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/decisions.md
          git diff --cached --quiet && exit 0
          git commit -qm "Record published episodes"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

  delete:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delete' && inputs.episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the episode's posts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          EPISODE: ${{ inputs.episode }}
        run: python -m shorts delete-posts "$EPISODE"
      - name: Record history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/decisions.md
          git diff --cached --quiet && exit 0
          git commit -qm "Remove deleted episode posts"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
