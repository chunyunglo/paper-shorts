# Twice a week: pick a paper, make the video, and (when enabled) post it everywhere.
# Scheduled runs only do anything once the repo variable AUTO_PUBLISH is "true".
name: Publish episode

on:
  schedule:
    - cron: "0 1 * * 2,5"  # Tue and Fri, 09:00 Taiwan time
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to YouTube, Instagram and Threads (otherwise just build the video)
        type: boolean
        default: false

concurrency: publish

permissions:
  contents: write

jobs:
  episode:
    if: github.event_name != 'schedule' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          render: "true"

      - name: Make episode
        run: |
          python -m shorts make
          echo "EP_DIR=$(ls -d out/*/ | head -1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            ${{ env.EP_DIR }}video.mp4
            ${{ env.EP_DIR }}cover.jpg
            ${{ env.EP_DIR }}script.md
            ${{ env.EP_DIR }}episode.json
          retention-days: 14

      - name: Should we publish?
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Host video on a GitHub release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ep=$(basename "$EP_DIR")
          title=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['script']['title_zh'])" "$EP_DIR/episode.json")
          gh release create "ep-$ep" "$EP_DIR/video.mp4" "$EP_DIR/cover.jpg" \
            --title "$title" --notes-file "$EP_DIR/script.md"
          echo "VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/ep-$ep/video.mp4" >> "$GITHUB_ENV"

      - name: Upload to platforms
        if: steps.mode.outputs.publish == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python -m shorts publish "$EP_DIR" --video-url "$VIDEO_URL"

      - name: Record history
        if: always() && steps.mode.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -qm "Episode $(basename "$EP_DIR")"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
