<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Noto Sans","Noto Sans CJK TC",sans-serif}
#c{position:absolute;inset:0;width:1920px;height:1080px}
#sub{position:absolute;left:160px;right:160px;bottom:58px;text-align:center;font-size:46px;font-weight:700;color:#fff;line-height:1.25;
 text-shadow:0 0 6px rgba(0,0,0,.9),0 3px 10px rgba(0,0,0,.8);letter-spacing:1px}
#sub .who{display:inline-block;font-size:28px;padding:4px 14px;border-radius:20px;margin-right:16px;vertical-align:middle;position:relative;top:-6px;text-shadow:none}
#sub .who.A{background:#ff6b4a;color:#fff}#sub .who.K{background:#f6efe3;color:#1d2a5c}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;opacity:0}
#title .k{font-size:150px;font-weight:900;letter-spacing:8px;line-height:.95;text-shadow:0 0 40px rgba(255,107,74,.8),0 8px 40px rgba(0,0,0,.6)}
#title .t{font-family:"Noto Serif",serif;font-style:italic;font-size:120px;color:#ffd0c4;margin-top:-6px;text-shadow:0 0 30px rgba(126,162,255,.8)}
#title .p{font-size:34px;margin-top:30px;color:#e6ecff;letter-spacing:2px;background:rgba(10,14,40,.6);padding:10px 28px;border-radius:40px}
.lt{position:absolute;bottom:170px;left:90px;opacity:0;background:linear-gradient(90deg,rgba(18,24,60,.95),rgba(18,24,60,.75));color:#fff;padding:14px 30px 14px 26px;border-left:10px solid #ff6b4a;font-size:44px;font-weight:900;letter-spacing:1px}
.lt small{display:block;font-size:24px;font-weight:500;color:#cfd6ff;letter-spacing:2px;text-transform:uppercase}
.card{position:absolute;top:110px;width:640px;background:rgba(246,239,227,.96);color:#1d2a5c;border-radius:22px;padding:34px 40px;box-shadow:0 20px 60px rgba(0,0,0,.45);border-top:10px solid #ff6b4a}
.card.right{right:90px}.card.left{left:90px}
.card .kicker{font-size:24px;font-weight:700;color:#ff6b4a;letter-spacing:3px;margin-bottom:14px}
.card .ptitle{font-size:38px;font-weight:900;line-height:1.3;margin-bottom:16px}
.card .meta{font-size:24px;line-height:1.5;color:#33406f}.card .dim{color:#7a7f99}
.card .big{font-size:96px;font-weight:900;line-height:1.05}.card .sub{font-size:30px;margin:6px 0 20px}
.card .row{font-size:30px;line-height:1.6;margin-top:6px}.card .coral{color:#ff6b4a}
.card .pill{background:#1d2a5c;color:#fff;border-radius:12px;padding:2px 12px;margin-right:8px}
.card .stat{display:flex;align-items:center;margin:14px 0}.card .num{font-size:78px;font-weight:900;width:250px;color:#1d2a5c}
.card .num.down{color:#ff6b4a}.card .num.dim{color:#9aa0b8}.card .lbl{font-size:30px;line-height:1.25}.card small{font-size:20px;color:#6b7090}
.card .tl{margin-top:10px}.card .lane{display:flex;align-items:center;margin:18px 0;font-size:28px}.card .lane b{width:150px}
.card .bar{flex:1;height:14px;background:#d9d2c3;border-radius:7px;position:relative}
.card .bar i{position:absolute;top:-9px;width:32px;height:32px;border-radius:50%;background:#ff6b4a;margin-left:-16px}
.card .gapnote{font-size:26px;color:#33406f;margin-top:10px}
#outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(20,26,51,.55);opacity:0}
#outro .t{font-size:110px;font-weight:900}#outro .s{font-size:36px;margin-top:20px;color:#ffd0c4}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="title"><div class="k">BEHAVIOR<br>DECODED</div><div class="t">Tonight</div><div class="p"></div></div>
<div id="nameK" class="lt">KAI<small>Host</small></div>
<div id="nameA" class="lt">ANNE<small>Resident data scientist</small></div>
<div id="card" class="card" style="opacity:0"></div>
<div id="sub"></div>
<div id="outro"><div class="t">BEHAVIOR DECODED</div><div class="s">Tonight · new episodes every week</div></div>
<script src="bundle.js"></script>
<script>
window.boot = async () => {
  const tl = await (await fetch('timeline.json')).json();
  document.querySelector('#title .p').textContent = tl.title;
  await window.setup(tl); return tl;
};
</script></body></html>
